backend:
  name: git-gateway
  branch: main

media_folder: "public/assets"
public_folder: "/assets"

collections:
  - name: "blog"
    label: "보도자료 및 공지사항"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "제목", name: "title", widget: "string"}
      - {label: "작성일", name: "pubDatetime", widget: "datetime"}
      - {label: "요약 설명", name: "description", widget: "string"}
      - {label: "본문 내용", name: "body", widget: "markdown"}
